version: "3.8"

services:
  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://property_manager:${DB_PASSWORD}@postgres:5432/property_manager
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.property-manager.rule=Host(`property.${DOMAIN}`)"
      - "traefik.http.routers.property-manager.entrypoints=websecure"
      - "traefik.http.routers.property-manager.tls.certresolver=letsencrypt"
      - "traefik.http.services.property-manager.loadbalancer.server.port=3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: property_manager
      POSTGRES_PASSWORD: ${DB_PASSWORD:-property_manager_dev}
      POSTGRES_DB: property_manager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
