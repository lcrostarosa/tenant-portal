version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: property_manager
      POSTGRES_PASSWORD: property_manager_dev
      POSTGRES_DB: property_manager
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
